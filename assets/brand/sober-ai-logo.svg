<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SoberAI logo">
  <defs>
    <linearGradient id="sober-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171e27"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="sober-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#22c55e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sober-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f3f4"/>
      <stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
    <radialGradient id="sober-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- app-icon field -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sober-bg)" stroke="#2a3340" stroke-width="2"/>

  <!-- lamp glow behind the beam -->
  <circle cx="62" cy="40" r="16" fill="url(#sober-glow)"/>

  <!-- beam fanning from the lamp room -->
  <polygon points="66,33 117,16 117,60 66,47" fill="url(#sober-beam)"/>

  <!-- circuit nodes dissolving out of the beam (AI motif) -->
  <g stroke="#0b0e12" stroke-width="2" opacity="0.85">
    <line x1="90" y1="33" x2="102" y2="38"/>
    <line x1="102" y1="38" x2="94" y2="47"/>
  </g>
  <g fill="#0b0e12" opacity="0.9">
    <circle cx="90" cy="33" r="3.4"/>
    <circle cx="102" cy="38" r="2.6"/>
    <circle cx="94" cy="47" r="2.2"/>
  </g>
  <g fill="#d7ffe4" opacity="0.9">
    <circle cx="90" cy="33" r="1.1"/>
    <circle cx="102" cy="38" r="0.9"/>
  </g>

  <!-- tower -->
  <path d="M44 100 L52 56 Q52 52 56 52 L68 52 Q72 52 72 56 L80 100 Z" fill="url(#sober-tower)"/>
  <rect x="44" y="78" width="36" height="7" fill="#1a73e8" opacity="0.9"/>
  <rect x="46.5" y="64" width="31" height="6" fill="#1a73e8" opacity="0.9"/>

  <!-- gallery deck + lamp room + cap -->
  <rect x="48" y="46" width="28" height="6" rx="3" fill="#2b3542"/>
  <rect x="54" y="34" width="16" height="12" rx="2" fill="#101418" stroke="#4ade80" stroke-width="2"/>
  <circle cx="62" cy="40" r="3.6" fill="#4ade80"/>
  <path d="M52 34 L62 25 L72 34 Z" fill="#4ade80"/>

  <!-- rock base -->
  <rect x="36" y="100" width="52" height="8" rx="4" fill="#232b36"/>
  <rect x="46" y="110" width="32" height="5" rx="2.5" fill="#1a222c"/>
</svg>
