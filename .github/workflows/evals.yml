name: evals

on:
  push:
  pull_request:

jobs:
  evals:
    name: AI eval gate (evalite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run offline eval suite (in-process module contract)
        run: npm run test:evals:vitest
      # A failing eval fails this job via evalite's --threshold exit code.
      # The live judge case (evals/evalite/judge.live.eval.ts) is evalite.skip'd
      # and never runs here — enabling it needs a key and is documented in
      # docs/evals.md.
